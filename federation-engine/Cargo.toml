[workspace]
resolver = "3"
# Library crates go under crates/ and are added here, e.g. members = ["crates/engine-core"].
members = [".", "crates/engine-config"]

[package]
name = "federation-engine"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "engine"
description = "HouseRx Federation Engine: SQL over the Postgres wire protocol, built on Apache DataFusion (ENG-1799)"

[[bin]]
name = "engine"
path = "src/main.rs"

# The acceptance suite (protected folder). One binary; each feature's check runs one test by exact name.
[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[dependencies]
async-trait = "0.1.92"
# AWS sources: the default credential chain and SigV4, over aws-smithy's rustls (aws-lc-rs) client.
aws-config = { version = "1.13", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio"] }
aws-sdk-cloudwatch = { version = "1.140", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1.163", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.137", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.157", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# Only to mark a source's sts_endpoint_url as programmatic config, so it wins over AWS_ENDPOINT_URL.
aws-types = "1.7"
axum = "0.8"
# Tempo trace JSON carries span and trace ids as base64 (protobuf JSON mapping).
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
datafusion = { version = "55", default-features = false, features = ["sql", "nested_expressions", "datetime_expressions", "string_expressions", "unicode_expressions", "regex_expressions", "crypto_expressions", "encoding_expressions", "recursive_protection"] }
engine-config = { path = "crates/engine-config" }
futures = "0.3.34"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
pgwire = "0.42"
postgres-types = "0.2.14"
# Telemetry Source HTTP clients: rustls with the webpki root store (no OS keychain). main()
# installs aws-lc-rs as the process default. reqwest's ring fallback is enabled on purpose: its
# features unify with the harness's reqwest, whose clients would otherwise panic "No provider set".
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustls = "0.23"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The Platform Database (platform_query): describe-only Parse/Describe at plan time, binary rows.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
uuid = { version = "1", features = ["v4"] }

# Used only by tests/acceptance. They drive the real `engine` binary through pg-wire and HTTP,
# so they compile without any engine code. Keep these: the protected harness needs them.
# Do not add `preserve_order` to serde_json here: dev-dependency features unify with the engine's
# own serde_json in test builds and would hide key-order bugs in the audit S3 body.
[dev-dependencies]
base64 = "0.22"
chrono = "0.4"
ciborium = "0.2"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rustls = "0.23"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.14"
uuid = { version = "1", features = ["v4"] }

# Dependencies (DataFusion, arrow, pgwire, aws-sdk) are compiled optimised even in the debug
# profile, so the debug build that init.sh produces meets the eng-perf-promql-large-range budget.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"
